spring:
  application:
    name: telemed-ia-notifications-api
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      data-source-properties:
        options: ${DB_STATEMENT_OPTIONS:-c statement_timeout=5000}
  # Migrations live in telemed-ia-notifications-db; the API never runs them
  # and only validates the mapped tables.
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  # HU-03: PasswordRecoveryRequested from identity. A failed delivery is
  # retried here, then rejected without requeue to the dead-letter queue.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: ${RABBITMQ_PREFETCH:10}
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:2s}
          multiplier: 2.0
          max-interval: 30s

notifications:
  # Off unless turned on, so tests and local tools never take real events.
  messaging:
    enabled: ${NOTIFICATIONS_LISTENER_ENABLED:false}
    dead-letter-ttl: PT30M
  mail:
    from: ${MAIL_FROM:no-reply@telemed.local}
    time-zone: ${MAIL_TIME_ZONE:America/Bogota}

server:
  port: ${PORT:8082}
  shutdown: graceful
  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${HTTP_KEEP_ALIVE_TIMEOUT:60s}
    max-keep-alive-requests: ${HTTP_MAX_KEEP_ALIVE_REQUESTS:100}

management:
  server:
    port: ${MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # An SMTP outage must not take the service out of rotation: failed
    # deliveries are recorded and retried through broker redelivery.
    mail:
      enabled: false
    # Same for the broker: the listener reconnects on its own and the events
    # wait in their durable queue meanwhile.
    rabbit:
      enabled: false
